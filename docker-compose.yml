version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sql-interview-postgres
    environment:
      POSTGRES_DB: interviewdb
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview123
    ports:
      - "5433:5432"
    volumes:
      - sql_postgres_data:/var/lib/postgresql/data

volumes:
  sql_postgres_data:
